<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 50px;
    }
  </style>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const noRedirect = params.get("noredir") === "true";

      if (!noRedirect) {
        setTimeout(() => {
          window.location.href = "https://github.com/HuskyNZ";
        }, 10000); // 10 seconds
      }
    });
  </script>
</head>
<body>
  <h1>Hi there, this is HuskyNZ's GitHub</h1>
  <p>You will be redirected to HuskyNZ's GitHub in 10 seconds...</p>
  <p>If you're not redirected, <a href="https://github.com/HuskyNZ">click here</a>.</p>
</body>
</html>
