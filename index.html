<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 50px;
    }
  </style>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const noRedirect = params.get("no") === "true";

      if (!noRedirect) {
        let secondsLeft = 10;
        console.log(`Redirecting in ${secondsLeft} seconds...`);

        const countdown = setInterval(() => {
          secondsLeft--;
          console.log(`${secondsLeft}...`);

          if (secondsLeft <= 0) {
            clearInterval(countdown);
            window.location.href = "https://github.com/HuskyNZ";
          }
        }, 1000);
      } else {
        console.log("No redirect due to ?noredir=true");
      }
    });
  </script>
</head>
<body>
  <h1>Hi there, this is HuskyNZ's GitHub</h1>
  <p>You will be redirected to HuskyNZ's GitHub in 10 seconds...</p>
  <p>If you're not redirected, <a href="https://github.com/HuskyNZ">click here</a>.</p>
</body>
</html>
